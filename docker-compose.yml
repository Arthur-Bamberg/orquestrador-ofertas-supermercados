# Local stack (workspace ADR 0004 / 0006). Apps use DATABASE_URL → Postgres :5432.
# Senha: copie `.env.example` na raiz para `.env` (gitignored). docker compose lê POSTGRES_PASSWORD de lá.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ofertas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env at repo root}
      POSTGRES_DB: ofertas
    volumes:
      - ofertas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofertas -d ofertas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ofertas_pg:
